name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Determine Minecraft version
        id: version
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$TAG" in
            *+26.1)
              echo "minecraft=26.1" >> "$GITHUB_OUTPUT"
              echo "modrinth_minecraft=26.1" >> "$GITHUB_OUTPUT"
              echo "module=mc26_1" >> "$GITHUB_OUTPUT"
              ;;
            *+26.1.1)
              echo "minecraft=26.1.1" >> "$GITHUB_OUTPUT"
              echo "modrinth_minecraft=26.1.1" >> "$GITHUB_OUTPUT"
              echo "module=mc26_1_1" >> "$GITHUB_OUTPUT"
              ;;
            *+26.1.2)
              echo "minecraft=26.1.2" >> "$GITHUB_OUTPUT"
              echo "modrinth_minecraft=26.1.2" >> "$GITHUB_OUTPUT"
              echo "module=mc26_1_2" >> "$GITHUB_OUTPUT"
              ;;
            *+26.2)
              echo "minecraft=26.2" >> "$GITHUB_OUTPUT"
              echo "modrinth_minecraft=26.2" >> "$GITHUB_OUTPUT"
              echo "module=mc26_2" >> "$GITHUB_OUTPUT"
              ;;
            *+26.3)
              echo "minecraft=26.3" >> "$GITHUB_OUTPUT"
              echo "modrinth_minecraft=26.3" >> "$GITHUB_OUTPUT"
              echo "module=mc26_3" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported release tag: $TAG"
              echo "Expected a tag ending in +26.1, +26.1.1, +26.1.2, +26.2, or +26.3."
              exit 1
              ;;
          esac

      - name: Build
        run: gradle :versions:${{ steps.version.outputs.module }}:build

      - name: Find release JAR
        id: jar
        shell: bash
        run: |
          DIR="versions/mc${{ steps.version.outputs.minecraft }}/build/libs"
          JAR="$(find "$DIR" -maxdepth 1 -type f -name 'borderlessmc-*.jar' ! -name '*-sources.jar' | head -n 1)"

          if [ -z "$JAR" ]; then
            echo "No BorderlessMC JAR was found in $DIR."
            exit 1
          fi

          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"
          echo "Found $JAR"

      - name: Upload JAR to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.jar.outputs.path }}
          fail_on_unmatched_files: true

      - name: Publish to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ vars.MODRINTH_PROJECT_ID }}
          name: ${{ github.event.release.name }}
          version: ${{ github.event.release.tag_name }}
          changelog: ${{ github.event.release.body }}
          loaders: |-
            fabric
            quilt
            neoforge
            forge
          game-versions: ${{ steps.version.outputs.modrinth_minecraft }}
          channel: release
          environment: client_only
          files: ${{ steps.jar.outputs.path }}
          primary-file: ${{ steps.jar.outputs.name }}
